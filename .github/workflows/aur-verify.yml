name: AUR verification

on:
  workflow_dispatch:
    inputs:
      source:
        description: Recipe to verify
        required: true
        default: published
        type: choice
        options:
          - published
          - repository
      version:
        description: AUR package version including pkgrel (for example 2.33.0-1)
        required: true
        type: string

permissions: {}

jobs:
  makepkg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      RECIPE_SOURCE: ${{ inputs.source }}
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout the pending repository recipe
        if: inputs.source == 'repository'
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git go
      - name: Build and install the AUR package
        run: |
          fail() { printf 'AUR verification: %s\n' "$1" >&2; exit 1; }
          [[ $EXPECTED_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] ||
            fail "Invalid expected version: $EXPECTED_VERSION"
          useradd --create-home builder
          recipe=$(mktemp -d)
          if [[ $RECIPE_SOURCE == repository ]]; then
            printf 'Using the pending recipe from %s\n' "$GITHUB_WORKSPACE"
            cp -a "$GITHUB_WORKSPACE/packaging/aur/." "$recipe/"
            chown -R builder "$recipe"
          else
            chown builder "$recipe"
            runuser -u builder -- git clone --depth 1 https://aur.archlinux.org/go-fuck.git "$recipe"
          fi
          cd "$recipe"
          if [[ $RECIPE_SOURCE == published ]]; then
            runuser -u builder -- git rev-parse HEAD
          fi
          printf 'Checking .SRCINFO against PKGBUILD\n'
          runuser -u builder -- makepkg --printsrcinfo | diff -u .SRCINFO - ||
            fail 'Could not generate matching .SRCINFO'

          package_list=$(runuser -u builder -- makepkg --packagelist) ||
            fail 'makepkg --packagelist failed'
          printf 'Expected build outputs:\n%s\n' "$package_list"
          package=''
          while IFS= read -r candidate; do
            case ${candidate##*/} in
              "go-fuck-${EXPECTED_VERSION}-x86_64.pkg.tar"|"go-fuck-${EXPECTED_VERSION}-x86_64.pkg.tar."*)
                [[ -z $package ]] || fail 'Found multiple matching main package paths'
                package=$candidate
                ;;
            esac
          done <<< "$package_list"
          [[ -n $package ]] || fail "No main package found for go-fuck $EXPECTED_VERSION (x86_64)"

          printf 'Building %s\n' "$package"
          runuser -u builder -- makepkg --clean --noconfirm
          [[ -f $package ]] || fail "Build did not create $package"
          built=$(pacman -Qp -- "$package")
          [[ $built == "go-fuck $EXPECTED_VERSION" ]] || fail "Unexpected built package: $built"
          pacman -U --noconfirm "$package"
          installed=$(pacman -Q go-fuck)
          [[ $installed == "go-fuck $EXPECTED_VERSION" ]] || fail "Unexpected installed package: $installed"
          printf 'Installed %s\n' "$installed"
          version_output=$(/usr/bin/go-fuck --version 2>&1)
          printf '%s\n' "$version_output"
          [[ $version_output == "go-fuck ${EXPECTED_VERSION%-*} using Go "* ]] ||
            fail "Unexpected CLI version: $version_output"
