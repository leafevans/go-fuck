name: AUR verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published AUR version including pkgrel (for example 2.31.21-1)
        required: true
        type: string

permissions: {}

jobs:
  makepkg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git go
      - name: Build and install the published AUR package
        run: |
          [[ $EXPECTED_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]
          useradd --create-home builder
          recipe=$(mktemp -d)
          chown builder "$recipe"
          runuser -u builder -- git clone --depth 1 https://aur.archlinux.org/go-fuck.git "$recipe"
          cd "$recipe"
          git -c safe.directory="$recipe" rev-parse HEAD
          runuser -u builder -- makepkg --printsrcinfo | diff -u .SRCINFO -
          expected_package="go-fuck-${EXPECTED_VERSION}-x86_64.pkg.tar.zst"
          package=$(runuser -u builder -- makepkg --packagelist)
          [[ ${package##*/} == "$expected_package" ]]
          runuser -u builder -- makepkg --clean --noconfirm
          pacman -U --noconfirm "$package"
          [[ $(pacman -Q go-fuck) == "go-fuck $EXPECTED_VERSION" ]]
          version_output=$(/usr/bin/go-fuck --version 2>&1)
          printf '%s\n' "$version_output"
          [[ $version_output == "go-fuck ${EXPECTED_VERSION%-*} using Go "* ]]
