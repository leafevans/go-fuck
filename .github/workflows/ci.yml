# Continuous integration: build, vet and test on Linux, macOS and Windows,
# plus formatting and lint checks.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-release-notes.sh
      - name: Validate notes for the current version
        id: notes
        run: |
          version=$(sed -n 's/^var Version = "\([^"]*\)"$/\1/p' internal/consts/consts.go)
          GITHUB_REF_NAME="v$version" bash scripts/release-notes-output.sh
      - name: Verify release notes output
        env:
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: test -s "$NOTES_PATH"

  build-test:
    name: Build and test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go:
          - "1.27.x"
          - "stable"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Check the PowerShell alias
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -trimpath -o "$env:RUNNER_TEMP\go-fuck.exe" ./cmd/go-fuck
          $alias = (& "$env:RUNNER_TEMP\go-fuck.exe" --alias) -join "`n"
          Invoke-Expression $alias
          if (-not (Get-Command fuck -ErrorAction SilentlyContinue)) {
            throw "the PowerShell alias was not defined"
          }

  powershell:
    name: PowerShell integration
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Build
        run: go build -trimpath -o go-fuck.exe ./cmd/go-fuck
      - name: Check with Windows PowerShell 5.1
        timeout-minutes: 2
        shell: powershell
        run: ./.github/scripts/powershell-integration.ps1 -Exe ./go-fuck.exe
      - name: Check with PowerShell 7
        timeout-minutes: 2
        shell: pwsh
        run: ./.github/scripts/powershell-integration.ps1 -Exe ./go-fuck.exe

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Test with the race detector
        run: go test -race ./... -count=1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Measure coverage
        run: go test ./... -count=1 -coverprofile=coverage.out
      - name: Enforce the coverage minimum
        run: go run ./tools/coveragecheck -profile coverage.out -min 95
      - name: Upload the coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: coverage.out

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # The allocation baseline is tied to the Go toolchain, so the
          # benchmark job follows go.mod instead of the moving stable version.
          go-version-file: go.mod
          cache: true
      - name: Run benchmarks
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/... -run '^$' -bench . -benchmem -count=1 | tee benchmark.txt
      - name: Guard the benchmark allocations
        run: go run ./tools/benchguard -bench benchmark.txt -baseline benchmarks/baseline.txt
      - name: Upload the benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: benchmark.txt

  rules-list:
    name: Rule list
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Check the generated rule list
        run: go run ./tools/gen-rule-list -check

  packaging:
    name: Packaging
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Check the distribution manifests
        run: go test ./packaging -count=1
      - name: Install the Homebrew formula
        run: |
          brew tap leafevans/go-fuck https://github.com/leafevans/go-fuck
          brew trust leafevans/go-fuck
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install go-fuck
      - name: Verify the installed binary
        run: go-fuck --version
      - name: Check the bash alias
        run: |
          eval "$(go-fuck --alias)"
          type fuck

  packaging-windows:
    name: Packaging (Scoop)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Install with Scoop
        shell: pwsh
        run: |
          go test ./packaging -count=1
          $expected = (Get-Content bucket/go-fuck.json -Raw | ConvertFrom-Json).version
          $scoop = Get-Command scoop -ErrorAction SilentlyContinue
          if (-not $scoop) {
            Invoke-RestMethod -Uri "https://get.scoop.sh" | Invoke-Expression
            $scoopPath = Join-Path $env:USERPROFILE "scoop\shims\scoop.cmd"
            if (-not (Test-Path -LiteralPath $scoopPath)) { throw "Scoop installation failed" }
          } else {
            $scoopPath = $scoop.Source
          }
          & $scoopPath bucket add go-fuck https://github.com/leafevans/go-fuck
          if ($LASTEXITCODE -ne 0) { throw "adding the Scoop bucket failed" }
          & $scoopPath install go-fuck
          if ($LASTEXITCODE -ne 0) { throw "installing with Scoop failed" }
          $prefix = (& $scoopPath prefix go-fuck | Out-String).Trim()
          $goFuck = Join-Path $prefix "go-fuck.exe"
          if (-not (Test-Path -LiteralPath $goFuck -PathType Leaf)) {
            throw "Scoop did not install go-fuck.exe"
          }
          $version = (& $goFuck --version 2>&1 | Out-String).Trim()
          if ($version -notmatch "^go-fuck $([regex]::Escape($expected)) using Go ") {
            throw "unexpected Scoop binary version: $version"
          }
          Write-Host $version

  shell-integration:
    name: Shell integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Install the shells
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish tcsh
      - name: Build
        run: go build -trimpath -o "$RUNNER_TEMP/go-fuck" ./cmd/go-fuck
      - name: Check the shell integration
        run: bash scripts/check-shell-integration.sh "$RUNNER_TEMP/go-fuck"
      - name: Check the quote round trips
        run: go test ./internal/shells -run 'TestQuoteRoundTrip' -count=1 -v
      - name: Check the tcsh alias behavior
        run: go test ./internal/shells -run 'TestTcshAlias|TestAliasSyntaxTcsh' -count=1 -v
      - name: Check the suggestion syntax
        run: go test ./internal/rules -run 'TestRuleSuggestionsAreShellSyntax' -count=1 -v

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Check formatting
        run: |
          files="$(gofmt -s -l .)"
          if [ -n "$files" ]; then
            echo "::error::The following Go files are not formatted; run 'make fmt':"
            echo "$files"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
