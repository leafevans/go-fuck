# Continuous integration: build, vet and test on Linux, macOS and Windows,
# plus formatting and lint checks.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go:
          - "1.27.x"
          - "stable"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Check the PowerShell alias
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -trimpath -o "$env:RUNNER_TEMP\go-fuck.exe" ./cmd/go-fuck
          $alias = (& "$env:RUNNER_TEMP\go-fuck.exe" --alias) -join "`n"
          Invoke-Expression $alias
          if (-not (Get-Command fuck -ErrorAction SilentlyContinue)) {
            throw "the PowerShell alias was not defined"
          }

  powershell:
    name: PowerShell integration
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Build
        run: go build -trimpath -o go-fuck.exe ./cmd/go-fuck
      - name: Check with Windows PowerShell 5.1
        shell: powershell
        run: ./.github/scripts/powershell-integration.ps1 -Exe ./go-fuck.exe
      - name: Check with PowerShell 7
        shell: pwsh
        run: ./.github/scripts/powershell-integration.ps1 -Exe ./go-fuck.exe

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Test with the race detector
        run: go test -race ./... -count=1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Measure coverage
        run: go test ./... -count=1 -coverprofile=coverage.out
      - name: Enforce the coverage minimum
        run: go run ./tools/coveragecheck -profile coverage.out -min 88
      - name: Upload the coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: coverage.out

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Run benchmarks
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/... -run '^$' -bench . -benchmem -count=1 | tee benchmark.txt
      - name: Upload the benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: benchmark.txt

  rules-list:
    name: Rule list
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Check the generated rule list
        run: go run ./tools/gen-rule-list -check

  packaging:
    name: Packaging
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Check the distribution manifests
        run: go test ./packaging -count=1
      - name: Install the Homebrew formula
        run: |
          brew tap leafevans/go-fuck https://github.com/leafevans/go-fuck
          brew trust leafevans/go-fuck
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install go-fuck
      - name: Verify the installed binary
        run: go-fuck --version
      - name: Check the bash alias
        run: |
          eval "$(go-fuck --alias)"
          type fuck

  shell-integration:
    name: Shell integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Install the shells
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish tcsh
      - name: Build
        run: go build -trimpath -o "$RUNNER_TEMP/go-fuck" ./cmd/go-fuck
      - name: Check the shell integration
        run: bash scripts/check-shell-integration.sh "$RUNNER_TEMP/go-fuck"

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Check formatting
        run: |
          files="$(gofmt -s -l .)"
          if [ -n "$files" ]; then
            echo "::error::The following Go files are not formatted; run 'make fmt':"
            echo "$files"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0