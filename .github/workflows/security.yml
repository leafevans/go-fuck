# Dependency vulnerability checks and security analysis. The blocking checks
# run on every main push and pull request; the full gosec report runs weekly and
# can be started manually.
name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  gosec-gate:
    name: Go security analysis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check audited integer conversions
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet -include=G115 ./...

  gosec-audit:
    name: Full gosec report (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate the report
        continue-on-error: true
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -fmt=json -out=gosec.json ./...
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gosec-${{ matrix.os }}
          path: gosec.json
          if-no-files-found: warn
