# GoReleaser configuration for go-fuck.
#
# Run "goreleaser check" to validate this file and "goreleaser release --snapshot
# --clean" to build the archives locally. Releases are published by the
# release workflow when a v* tag is pushed.

version: 2

project_name: go-fuck

before:
  hooks:
    - go mod download

builds:
  - id: go-fuck
    main: ./cmd/go-fuck
    binary: go-fuck
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/leafevans/go-fuck/internal/consts.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: go-fuck
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - CONTRIBUTING.md
      - PORTING.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
